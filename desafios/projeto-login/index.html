<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="estilos/mediaqueries.css">
    <title>Login</title>
</head>
<body>
    <main>
        <section id="login">
            <div id="img"></div>
            
            <div id="form">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
            </div>
            <form action="login.php" method="post" autocomplete="on">
                <div class="field">
                    <i class="material-symbols-outlined">person</i>
                    <input type="email" name="login" id="ilogin" placeholder="Email" autocomplete="email" required maxlength="30">
                    <label for="ilogin">Login</label>
                </div>
                <div class="field">
                    <i class="material-symbols-outlined">vpn_key</i>
                    <input type="password" name="pswd" id="ipswd" placeholder="Senha" autocomplete="current-password" required minlength="8" maxlength="20">
                    <label for="ipswd">Senha</label>
                </div>
                <input type="submit" value="Entrar">
                <a href="esqueci.html" class="button">Esqueci a senha</a> <i class="material-symbols-outlined">mail</i>
            </form>
        </section>



    </main>
</body>
</html>
